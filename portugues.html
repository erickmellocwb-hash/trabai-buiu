<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forca das Palavras - Português</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <a href="index.html" id="btn-home">🏠 Início</a>

    <div class="page-container">
        <div class="game-header">
            <h1>📝 Forca das Palavras</h1>
            <p>Adivinhe a palavra relacionada a Português!</p>
        </div>

        <div class="hangman-container">
            <div class="hangman-drawing" id="hangman-drawing"></div>
            <div class="hint-box" id="hangman-hint">Dica: ...</div>
            <div class="word-display" id="hangman-word"></div>
            <div class="letters-grid" id="letters-grid"></div>
            <div class="hangman-message" id="hangman-message"></div>
            <br>
            <button class="btn btn-success" id="btn-new-hangman" onclick="startHangman()" style="display:none;">Jogar Novamente</button>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        startHangman();
    </script>
</body>
</html>
